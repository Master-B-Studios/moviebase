    <style>
      body {display: grid;grid-template-columns: min-content auto;grid-template-rows: 100vh;background-color: #000000;margin: 0;padding: 0;overflow-y: scroll;color: #dbdbdb;font-size: 1rem;font-family: Arial, Helvetica, sans-serif;-webkit-tap-highlight-color: transparent;}
      .sidebar {grid-column: 1;grid-row: 1;display: grid;grid-template-columns: min-content;grid-template-rows: min-content min-content min-content min-content min-content min-content min-content min-content min-content;background: linear-gradient(50deg, #22222299, #11111144, #22222299, #11111144);border-right: 0.01rem solid #999999;}
      .sidebar a {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;background: linear-gradient(50deg, #33333399, #22222299, #33333399, #22222299, #33333399);border-radius: 1rem;border: 0.01rem solid #99999900;text-decoration: none;color: #999999;white-space: pre;cursor: pointer;transition: all 0.6s;}
      .sidebar a:hover {color: #dbdbdb;border-color: #dbdbdb;background: linear-gradient(50deg, #1b7c1b89, #183a0e99, #1b7c1b89, #183a0e99, #1b7c1b89);}
      .sidebar a svg {margin: 0 0.5rem 0 0;}
      .sidebarSpacer {height: 3rem;}
      
      .main {grid-column: 2;grid-row: 1;display: grid;grid-template-columns: min-content;grid-template-rows: min-content;background: linear-gradient(50deg, #22222299, #33333344, #22222299, #33333344);}

      .sortButton {height: 3rem;display: flex;align-items: center;justify-content: left;margin: 0.5rem 0.5rem 0 0.5rem;padding: 0 1rem 0 0.5rem;background: linear-gradient(50deg, #33333399, #22222299, #33333399, #22222299, #33333399);border-radius: 1rem;border: 0.01rem solid #99999900;text-decoration: none;color: #999999;white-space: pre;cursor: pointer;transition: all 0.6s;}
      .sortButton:hover {color: #dbdbdb;border-color: #dbdbdb;background: linear-gradient(50deg, #1b7c1b89, #183a0e99, #1b7c1b89, #183a0e99, #1b7c1b89);}
      .sortButtonText {margin: 0;}
      .sortButtonArrow {margin: 0 0 0 1rem;}


      .randomButtonLandscape {height: 3rem;grid-column: 2;grid-row: 1;margin: 0.5rem 0 0 0.5rem;padding: 0 1rem;white-space: pre;}
      .searchContainerLandscape {width: auto;height: 4rem;grid-column: 3;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
      .searchContainerLandscape input {width: auto;height: 3.15rem;margin: 0;padding: 0 0.5rem;background-color: #222222;border-radius: 0.5rem;border: 1px solid #444444;box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;color: #dbdbdb;cursor: text;}
      .addMovieLandscape {width: 3rem;height: 3rem;grid-column: 4;grid-row: 1;margin: 0.5rem 0 0 0.5rem;}
      .addMovieLandscape img {width: 80%;height: 80%;}

      .headerPortrait {width: 100vw;height: 4rem;position: fixed;top: 0;z-index: 8900;display: grid;grid-template-columns: auto min-content;grid-template-rows: min-content min-content;}
      .sortButtonPortrait {width: auto;height: 3rem;grid-column: 1 / span 2;grid-row: 1;margin: 0.5rem 0.5rem 0.5rem 4.1rem;padding: 0 0.5rem 0 1rem;white-space: pre;}
      .sortButtonPortrait .sortButtonArrow {position: relative;top: 0.1rem;}
      .randomButtonPortrait {width: auto;height: 3rem;grid-column: 2;grid-row: 2;margin: 0 0.5rem 0 0;padding: 0 1rem;white-space: pre;}
      .searchContainerPortrait {width: 100%;height: 4rem;grid-column: 1;grid-row: 2;text-align: center;margin: 0;padding: 0;}
      .searchContainerPortrait input {width: calc(100% - 1rem);height: 3.15rem;margin: 0;padding: 0 0.5rem;background-color: #222222;border-radius: 0.5rem;border: 1px solid #444444;box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;color: #dbdbdb;cursor: text;}
      .addMoviePortrait {display: none;}
      #search_container input:focus {background-color: #222222;outline: none;border: 1px solid #666666;}
      #search_container input::-webkit-search-cancel-button {filter: invert(50%) brightness(150%);cursor: pointer;}

      #sort_overlay {display: none;position: fixed;inset: 0;z-index: 9100;background-color: #000000cc;align-items: center;justify-content: center;padding: 1rem;box-sizing: border-box;}
      #sort_overlay_content {width: min(90vw, 40rem);max-height: 80vh;padding: 1rem;background-color: #111111;border: 1px solid #444444;border-radius: 0.5rem;box-shadow: rgba(0, 0, 0, 0.8) 0 0 2rem;display: flex;flex-wrap: wrap;justify-content: center;gap: 0.5rem;overflow-y: auto;}
      #sort_overlay_title {width: 100%;text-align: center;font-size: 1.5rem;margin-bottom: 0.5rem;color: #dbdbdb;}
      .sort_option {width: 15rem;min-height: 3rem;}

      .outputLandscape {margin: 4.25rem;z-index: 100;}
      .outputPortrait {margin: 7.75rem 0.5rem 1rem 0.5rem;z-index: 100;}

      .group_button {display: none;}
      .group_button.aktiv {display: block;}
      @media (orientation: portrait) {#group_single_Zufall .cardContainer {grid-template-columns: 70vw;grid-template-rows: 100%;justify-content: center;} #group_single_Zufall .cardContainer .movieCard {margin: 15vw auto;}}


      .cardContainer {display: grid;grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));gap: 1.5rem;}
      .movieCard {color: #dbdbdb;width: auto;height: auto;display: grid;grid-template-columns: auto auto;grid-template-rows: min-content auto min-content;background-color: #222222;border-radius: 0.5rem;border: 1px solid #444444;color: #999999;position: relative;top: 0;margin: 0;cursor: pointer;transition: all 0.6s;}
      .movieCard:hover {border-color: #999999;top: -0.5rem;}
      .movieCard:hover .movieTitle {color: #999999;}
      .movieCard:hover .movieNumber {color: #999999;}
      .movieCard:hover .movieNumber svg {color: #999999;}
      .movieCard:hover .movieYear {color: #999999;}
      .movieCard:hover .movieYear svg {color: #999999;}
      .movieCard:hover .movieOverlay1 {box-shadow: rgba(0, 0, 0, 0.7) 2px 2px 6px 1px inset;}
      .movieCard:hover .movieOverlay2 {opacity: 0;}
      .moviePoster {grid-column: 1 / span 2;grid-row: 1;width: calc(100%);height: auto;aspect-ratio: 2/3;display: flex;justify-content: center;align-items: center;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;}
      .moviePoster img {width: 100%;height: auto;object-fit: contain;border-top-left-radius: 0.5rem;border-top-right-radius: 0.5rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);}
      .moviePosterOverlay {grid-column: 1 / span 2;grid-row: 2;height: 1rem;position: relative;top: -1rem;background: linear-gradient(180deg, #22222200, #22222222, #22222244, #22222299, #222222ff);}
      .movieTitle {grid-column: 1 / span 2;grid-row: 2;font-size: 0.7rem;margin: 0.5rem 0.5rem 0 0.5rem;line-height: 1rem;display: flex;align-items: center;justify-content: center;text-align: center;color: #dbdbdb;transition: all 0.6s;}
      .movieNumber {grid-column: 1;grid-row: 3;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;color: #dbdbdb;transition: all 0.6s;}
      .movieNumber svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;color: #dbdbdb;transition: all 0.6s;}
      .movieYear {grid-column: 2;grid-row: 3;font-size: 0.7rem;margin: 0.5rem;line-height: 1rem;white-space: nowrap;display: flex;align-items: center;justify-content: center;color: #dbdbdb;transition: all 0.6s;}
      .movieYear svg {position: relative;left: -0.25rem;width: 0.7rem;height: 0.7rem;color: #dbdbdb;transition: all 0.6s;}
      .movieOverlay1 {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 0.5rem;box-shadow: rgba(255, 255, 255, 0.3) 2px 2px 6px 1px inset;transition: all 0.8s;}
      .movieOverlay2 {grid-column: 1 / span 2;grid-row: 1 / span 3;z-index: 1000;border-radius: 0.5rem;background: linear-gradient(50deg, #00000000, #00000000, #00000066, #00000000, #00000000, #00000000, #00000099, #00000000);transition: all 0.8s;}
      
      
      .overlayBase {width: 100vw;height: 100vh;background-color: #000000cc;position: fixed;z-index: 9099;inset: 0;}

      .overlayWindowLandscape {width: calc(100vw - 5vh);height: calc(100vh - 5vh);position: fixed;z-index: 9100;inset: 0;background-color: #00000099;overflow: hidden;border-radius: 0.5rem;border: 1px solid #444444;padding: 0;margin: auto;display: grid;grid-template-columns: auto auto;grid-template-rows: auto;}
      .overlayImageLandscape {grid-column: 1;grid-row: 1;height: calc(100vh - 5vh);}
      .overlayImageLandscape img {width: auto;height: calc(100% - 2rem);border-radius: 0.5rem;margin: 1rem;}
      .overlayContainerLandscape {grid-column: 2;grid-row: 1;background: none;}
      .overlayInfo1Landscape {width: 100%;height: 100%;grid-column: 2;grid-row: 1;background-color: #00000000;display: grid;grid-template-columns: min-content min-content min-content min-content auto min-content min-content min-content;grid-template-rows: 4rem auto min-content;font-size: 1rem;color: #dbdbdb;place-items: center;}
      .overlayFSKLandscape {width: 3rem;height: 3rem;grid-column: 1;grid-row: 1;margin: 1rem 0 0 0;} .overlayFSKLandscape img {width: 100%;height: 100%;}
      .overlayNumberLandscape {height: 3rem;grid-column: 2;grid-row: 1;padding: 0 1rem;margin: 1rem 0 0 1rem;white-space: nowrap;}
      .overlayNumberLandscape svg {position: relative;left: -0.5rem}
      .overlayYearLandscape {height: 3rem;grid-column: 3;grid-row: 1;padding: 0 1rem;margin: 1rem 0 0 1rem;white-space: nowrap;}
      .overlayYearLandscape svg {position: relative;left: -0.5rem}
      .overlayTimeLandscape {height: 3rem;grid-column: 4;grid-row: 1;padding: 0 1rem;margin: 1rem 0 0 1rem;white-space: nowrap;}
      .overlayTimeLandscape svg {position: relative;left: -0.5rem}
      .spacer1Landscape {grid-column: 5;grid-row: 1;}
      .overlayDownloadImageLandscape {height: 3rem;grid-column: 6;grid-row: 1;padding: 0 1rem;margin: 1rem 1rem 0 0;white-space: nowrap;}
      .overlayDownloadImageLandscape svg {position: relative;left: -0.5rem}
      .overlayDownloadNFOLandscape {height: 3rem;grid-column: 7;grid-row: 1;padding: 0 1rem;margin: 1rem 1rem 0 0;white-space: nowrap;}
      .overlayDownloadNFOLandscape svg {position: relative;left: -0.5rem}
      .exitButtonLandscape {width: 3rem;height: 3rem;grid-column: 8;grid-row: 1;padding: 0;margin: 1rem 1rem 0 0;white-space: nowrap;}
      .overlayTitleLandscape {grid-column: 1 / span 8;grid-row: 2;padding: 0.5rem 1rem;font-size: 4rem;font-style: oblique;font-weight: bolder;text-align: center;line-height: normal;}
      .overlayPlotLandscape {grid-column: 1 / span 8;grid-row: 3;padding: 1rem;margin: 1rem 1rem 1rem 0;text-align: justify;}
      
      @media (orientation: landscape) and (max-height: 500px) {
        .overlayImageLandscape img {width: auto;height: calc(100% - 1rem);border-radius: 0.5rem;margin: 0.5rem;}

        .overlayFSKLandscape {width: 2rem;height: 2rem;margin: 0;} .overlayFSKLandscape img {width: 100%;height: 100%;}
        .overlayNumberLandscape {height: 2rem;padding: 0 0.25rem;margin: 0 0 0 0.5rem;}
        .overlayNumberLandscape svg {width: 1rem;height: 1rem;position: relative;left: -0.1rem}
        .overlayYearLandscape {height: 2rem;padding: 0 0.25rem;margin: 0 0 0 0.5rem;}
        .overlayYearLandscape svg {width: 1rem;height: 1rem;position: relative;left: -0.1rem}
        .overlayTimeLandscape {height: 2rem;padding: 0 0.25rem;margin: 0 0 0 0.5rem;}
        .overlayTimeLandscape svg {width: 1rem;height: 1rem;position: relative;left: -0.1rem}
        .overlayDownloadImageLandscape {height: 2rem;padding: 0 0.25rem;margin: 0 0.5rem 0 0;}
        .overlayDownloadImageLandscape svg {width: 1rem;height: 1rem;position: relative;left: -0.1rem}
        .overlayDownloadNFOLandscape {height: 2rem;padding: 0 0.25rem;margin: 0 0.5rem 0 0;}
        .overlayDownloadNFOLandscape svg {width: 1rem;height: 1rem;position: relative;left: -0.1rem}
        .exitButtonLandscape {width: 2rem;height: 2rem;margin: 0 0.5rem 0 0;}
        .overlayTitleLandscape {font-size: clamp(1.5rem, 4vh, 2rem);padding: 0.2rem;}
        .overlayPlotLandscape {font-size: 0.7rem;line-height: 1rem;margin: 0 0.5rem 0.5rem 0;padding: 0.5rem;}
      }
      
      .overlayWindowPortrait {width: 100vw;height: 100vh;position: fixed;inset: 0;z-index: 9100;background-color: #000000cc;overflow: hidden;padding: 0;margin: 0;display: grid;grid-template-columns: auto;grid-template-rows: auto;}
      .overlayImagePortrait {grid-column: 1;grid-row: 1;width: 100vw;}
      .overlayImagePortrait img {width: 100%;height: auto;}
      .overlayContainerPortrait {width: 100vw;height: 100vh;grid-column: 1;grid-row: 1;background: linear-gradient(180deg, #000000cc, #000000cc, #000000ff, #000000ff, #000000ff);display: grid;grid-template-columns: auto;grid-template-rows: min-content auto min-content;place-items: center;}
      .overlayInfo1Portrait {width: 100vw;height: min-content;grid-column: 1;grid-row: 1;background-color: #00000000;display: grid;grid-template-columns: min-content min-content auto min-content;grid-template-rows: 4rem auto min-content;place-items: center;font-size: 1rem;color: #dbdbdb;}
      .overlayDownloadImagePortrait {height: 3rem;grid-column: 1;grid-row: 1;padding: 0 1rem;margin: 0 0 0 0.5rem;white-space: nowrap;}
      .overlayDownloadImagePortrait svg {position: relative;left: -0.5rem}
      .overlayDownloadNFOPortrait {height: 3rem;grid-column: 2;grid-row: 1;padding: 0 1rem;margin: 0 0 0 0.5rem;white-space: nowrap;}
      .overlayDownloadNFOPortrait svg {position: relative;left: -0.5rem}
      .spacer1Portrait {grid-column: 3;grid-row: 1;}
      .exitButtonPortrait {width: 3rem;height: 3rem;margin: 0 0.5rem 0 0;grid-column: 4;grid-row: 1;white-space: nowrap;}
      .overlayTitlePortrait {grid-column: 1;grid-row: 2;padding: 0.5rem 1rem;font-size: 3rem;font-style: oblique;font-weight: bolder;text-align: center;line-height: normal;word-break: break-word;hyphens: auto;}
      .overlayInfo2Portrait {width: 100vw;height: min-content;grid-column: 1;grid-row: 3;background-color: #00000000;display: grid;grid-template-columns: min-content min-content min-content auto min-content;grid-template-rows: 4rem min-content;place-items: center;font-size: 1rem;color: #dbdbdb;}
      .overlayNumberPortrait {height: 3rem;grid-column: 1;grid-row: 1;margin: 0 0 0 0.5rem;padding: 0 0.5rem;white-space: nowrap;}
      .overlayNumberPortrait svg {position: relative;left: -0.1rem}
      .overlayYearPortrait {height: 3rem;grid-column: 2;grid-row: 1;margin: 0 0 0 0.5rem;padding: 0 0.5rem;white-space: nowrap;}
      .overlayYearPortrait svg {position: relative;left: -0.1rem}
      .overlayTimePortrait {height: 3rem;grid-column: 3;grid-row: 1;margin: 0 0 0 0.5rem;padding: 0 0.5rem;white-space: nowrap;}
      .overlayTimePortrait svg {position: relative;left: -0.1rem}
      .spacer2Portrait {grid-column: 4;grid-row: 1;}
      .overlayFSKPortrait {width: 3rem;height: 3rem;grid-column: 5;grid-row: 1;margin: 0.5rem;}
      .overlayFSKPortrait img {width: 100%;height: 100%;}
      .overlayPlotPortrait {grid-column: 1 / span 5;grid-row: 2;margin: 0 0.5rem 0.5rem 0.5rem;padding: 0.5rem;text-align: justify;line-height: 1rem;font-size: 0.7rem;font-family: Verdana, Geneva, Tahoma, sans-serif;}

<script>
  const sidebar = document.getElementById('sidebar');
  function setSite(obj) {document.getElementById(obj).style = 'color: #dbdbdb;border-color: #dbdbdb;background: linear-gradient(50deg, #1b7c1b89, #183a0e99, #1b7c1b89, #183a0e99, #1b7c1b89);';}

  let current_data = [];let currentGroup = 'Name  ';let current_sort_direction = 'asc';

  async function load_moviebase() {
    try {
      const response = await fetch('movies.json');
      if (!response.ok) throw new Error('movies.json konnte nicht geladen werden.');
      current_data = await response.json();
      load_navigation();
      //load_table_data(current_data);
    }
    catch(err) {document.getElementById('output').innerHTML = '<h3>Fehler</h3><p>' + err.message + '</p>';console.error(err);}
  }

  function load_navigation() {
    const sortButton = document.createElement('div');
    sortButton.id = 'sortButton';
    sortButton.className = 'sortButton';
    sortButton.onclick = () => {sort_overlay.style.display = 'flex';};

    const sortButtonText = document.createElement('div');
    sortButtonText.id = 'sortButtonText';
    sortButtonText.className = 'sortButtonText';
    const sortButtonArrow = document.createElement('div');
    sortButtonArrow.className = 'sortButtonArrow';
    sortButtonArrow.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M465-363.5q-7-2.5-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5q-8 0-15-2.5Z"/></svg>';
    sortButton.appendChild(sortButtonText);
    sortButton.appendChild(sortButtonArrow);
    sidebar.appendChild(sortButton);

    setGroupActive();

  }
  
  function sortGroup(z) {
    const same_group = currentGroup === z;
    if (same_group) {current_data.reverse();current_sort_direction = current_sort_direction === 'asc' ? 'desc' : 'asc';}
    else {
      currentGroup = z;
      current_sort_direction = 'asc';
      current_data.sort((a, b) => {
        if (z === 'Nummer') {
          const numA = parseInt(a[Object.keys(a)[0]]) || 0;
          const numB = parseInt(b[Object.keys(b)[0]]) || 0;
          return numA - numB;
        }
        else {
          const nameA = String(a[Object.keys(a)[1]] ?? '');
          const nameB = String(b[Object.keys(b)[1]] ?? '');
          return nameA.localeCompare(nameB, 'de');
        }
      });
    }
    load_table_data(current_data, z);
    setGroupActive();
  }

  function load_table_data(data, group_extra = null) {
    const container = document.getElementById('output');container.innerHTML = '';
    const groups = {
      'Nummer': [], 'Name ': [], 'Zufall': [], '0-9': [],
      ...Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => [c, []]))
    };
    for (const entry of data) {
      const name = entry.title ?? '';
      const letter_1 = name.charAt(0).toUpperCase();
      groups['Name  '].push(entry);
      groups['Zufall'].push(entry);
      groups['Nummer'].push(entry);
      if (/[0-9]/.test(letter_1)) {groups['0-9'].push(entry);}
      else if (groups[letter_1]) {groups[letter_1].push(entry);}
    }

    for (const group_single in groups) {
      const groupDiv = document.createElement('div');
      groupDiv.id = 'group_single_' + group_single;
      groupDiv.className = 'group_button';
      if (group_single === (group_extra || 'Name  ')) {groupDiv.classList.add('aktiv');}
      let data = groups[group_single];
      if (group_single === 'Nummer') {
        data.sort((a, b) => {
          const numA = parseInt(a.id) || 0;
          const numB = parseInt(b.id) || 0;
          return current_sort_direction === 'asc' ? numA - numB : numB - numA;
        });
      }
      else if (group_single !== 'Zufall') {
        data.sort((a, b) => {
          const nameA = a.title ?? '';
          const nameB = b.title ?? '';
          return current_sort_direction === 'asc' ? nameA.localeCompare(nameB, 'de') : nameB.localeCompare(nameA, 'de');
        });
      }
      if (data.length > 0) {const table = generate_table_data(data);groupDiv.appendChild(table);}
      else {groupDiv.innerHTML = '<p>Keine Einträge gefunden...</p>';}
      container.appendChild(groupDiv);
    }
  }

  function setGroupActive() {
    const sortButtonText = document.getElementById('sortButtonText');
    const sortButtonArrow = document.querySelector('.sortButtonArrow');
    const arrowDown = '<svg width="24px" height="24px" viewBox="0 -960 960 960" fill="currentColor"><path d="M465-363.5q-7-2.5-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5q-8 0-15-2.5Z"/></svg>';

    if (!sortButtonText || !sortButtonArrow) return;

    else {sortButtonArrow.innerHTML = current_sort_direction === 'asc' ? arrowDown : arrowUp;}

  function search_in_table_data(search_index) {
    const group_div = document.getElementById('group_single_' + currentGroup);
    if (!group_div) return;
    const cards = group_div.querySelectorAll('.movieCard');
    const search = search_index.trim().toLowerCase();
    cards.forEach(card => {
      const title = card.dataset.title;
      card.style.display = (search === '' || title.includes(search)) ? '' : 'none';

            overlayDownloadNFO.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg> Info-File';
            overlayDownloadNFO.onclick = () => downloadNFO(movie);
            overlayInfo1.appendChild(overlayDownloadNFO);
            const spacer1 = document.createElement('div');
            spacer1.className = 'spacer1Portrait';
            overlayInfo1.appendChild(spacer1);
            exitButton.className = 'exitButtonPortrait mb_button';
            exitButton.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>';
            exitButton.onclick = () => removeOverlay();
            overlayInfo1.appendChild(exitButton);
          overlayContainer.appendChild(overlayInfo1);
          
          overlayTitle.className = 'overlayTitlePortrait';
          overlayTitle.innerHTML = movie.title;
          overlayContainer.appendChild(overlayTitle);
          
          overlayInfo2.className = 'overlayInfo2Portrait';
            overlayNumber.className = 'overlayNumberPortrait mb_text';
            overlayNumber.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m240-160 40-160H120l20-80h160l40-160H180l20-80h160l40-160h80l-40 160h160l40-160h80l-40 160h160l-20 80H660l-40 160h160l-20 80H600l-40 160h-80l40-160H360l-40 160h-80Zm140-240h160l40-160H420l-40 160Z"/></svg>' + movie.id;
            overlayInfo2.appendChild(overlayNumber);

            overlayYear.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>' + movie.year;
            overlayInfo2.appendChild(overlayYear);
            overlayTime.className = 'overlayTimePortrait mb_text';
            overlayTime.innerHTML = '<svg height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M420-800h120-120Zm0 640h120-120Zm-60 80-54-182q-48-38-77-95t-29-123q0-66 29-123t77-95l54-182h240l54 182q48 38 77 95t29 123q0 66-29 123t-77 95L600-80H360Zm261.5-258.5Q680-397 680-480t-58.5-141.5Q563-680 480-680t-141.5 58.5Q280-563 280-480t58.5 141.5Q397-280 480-280t141.5-58.5ZM404-750q20-5 38.5-8t37.5-3q19 0 37.5 3t38.5 8l-16-50H420l-16 50Zm16 590h120l16-50q-20 5-38.5 7.5T480-200q-19 0-37.5-2.5T404-210l16 50Z"/></svg>' + movie.runtime;

        overlayWindow.appendChild(overlayContainer);
      document.body.appendChild(overlayWindow);
    }
    
    document.body.appendChild(overlayBase);
    document.body.style = 'overflow: hidden;';
  }
  function removeOverlay() {document.querySelector('.overlayBase')?.remove();document.querySelector('.overlayWindowLandscape')?.remove();document.querySelector('.overlayWindowPortrait')?.remove();document.body.style = 'overflow: scroll;';}

  function downloadImage(movie) {downloadFile(movie.poster, `${movie.filename}-poster.jpg`);}
  function downloadNFO(movie) {downloadFile(`Movies/${movie.folder}/${movie.filename}.nfo`, `${movie.filename}.nfo`);}
  function downloadFile(url, filename) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
